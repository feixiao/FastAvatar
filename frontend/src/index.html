<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avatar Capsule</title>
  <link rel="stylesheet" href="./main.css">
</head>
<body>
  <!-- 悬浮胶囊主体 -->
  <div class="capsule" id="capsule">
    <!-- 拖拽把手区 -->
    <div class="drag-handle" style="--wails-draggable:drag"></div>

    <!-- 左侧状态律动球/声波 -->
    <div class="orb-container" id="orbContainer" title="点击打断/重置">
      <div class="orb-core" id="orbCore"></div>
      <div class="orb-ring" id="orbRing"></div>
      <canvas class="wave-canvas" id="waveCanvas" width="32" height="32"></canvas>
    </div>

    <!-- 中间状态与副标题文字 -->
    <div class="info-container" id="infoContainer">
      <div class="status-row">
        <span class="status-indicator" id="statusIndicator"></span>
        <span class="status-text" id="statusText">待命 (Idle)</span>
        <button class="badge-btn persona-badge" id="personaBadge" title="点击轮转人格">🌙 伴侣</button>
        <button class="badge-btn mode-badge" id="modeBadge" title="切换免唤醒/按键模式">免唤醒</button>
      </div>
      <div class="subtitle-text" id="subtitleText">随时开口与我畅聊...</div>
    </div>

    <!-- 右侧快捷操作区 -->
    <div class="action-container">
      <button class="icon-btn" id="btnMemory" title="打开记忆与人格中枢">🧠</button>
      <button class="icon-btn" id="btnInput" title="文字输入">💬</button>
      <button class="icon-btn" id="btnInterrupt" title="立即打断 (Barge-in)">⏹</button>
    </div>
  </div>

  <!-- 极简文字输入弹出条 -->
  <div class="input-drawer" id="inputDrawer">
    <input type="text" id="textInput" placeholder="输入对话并按回车..." autofocus />
  </div>

  <!-- 记忆与人格可视化中枢面板 -->
  <div class="manage-drawer" id="manageDrawer">
    <div class="drawer-header">
      <span class="drawer-title">伴侣控制中枢</span>
      <div class="tab-buttons">
        <button class="tab-btn active" data-tab="memoryTab">🧠 记忆</button>
        <button class="tab-btn" data-tab="personaTab">🎭 人格</button>
        <button class="tab-btn" data-tab="bondTab">✨ 羁绊</button>
      </div>
      <button class="close-btn" id="btnCloseDrawer">✕</button>
    </div>

    <div class="drawer-content">
      <!-- Tab 1: 记忆库 -->
      <div class="tab-pane active" id="memoryTab">
        <div class="section-title">核心画像 (Profile)</div>
        <div class="tag-list" id="profileList">
          <!-- 动态注入画像标签 -->
        </div>
        <div class="add-row">
          <input type="text" id="newProfKey" placeholder="特征键(如:饮食偏好)" />
          <input type="text" id="newProfVal" placeholder="具体事实(如:美式不加糖)" />
          <button class="btn-sm" id="btnAddProfile">添加</button>
        </div>

        <div class="section-title" style="margin-top: 10px;">近期情景与事件 (Episodes)</div>
        <div class="episode-list" id="episodeList">
          <!-- 动态注入事件条目 -->
        </div>
      </div>

      <!-- Tab 2: 人格卡槽 -->
      <div class="tab-pane" id="personaTab">
        <div class="auto-schedule-row">
          <label class="switch-label">
            <input type="checkbox" id="chkAutoSchedule" checked />
            <span>时段自动流转 (工作时段幕僚 / 夜间知心伴侣)</span>
          </label>
        </div>
        <div class="slot-list" id="slotList">
          <!-- 动态注入卡槽卡片 -->
        </div>
      </div>

      <!-- Tab 3: 羁绊进阶 -->
      <div class="tab-pane" id="bondTab">
        <div class="bond-summary">
          <div class="bond-level" id="bondLevelText">Lv.1 初识助手</div>
          <div class="bond-streak" id="bondStreakText">🔥 已连续陪伴 1 天</div>
        </div>
        <div class="xp-bar-track">
          <div class="xp-bar-fill" id="xpBarFill" style="width: 10%;"></div>
        </div>
        <div class="xp-label" id="xpLabelText">0 / 100 XP</div>
        <div class="bond-hint">交互越多，亲密度越高，伴侣的语气与默契感将随等级自动深化。</div>
      </div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
