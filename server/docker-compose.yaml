services:
  cloud-gateway:
    build:
      context: ..
      dockerfile: server/Dockerfile.gateway
    container_name: avatar-cloud-gateway
    restart: unless-stopped
    ports:
      - "8088:8088"
    environment:
      - PORT=8088
      - GATEWAY_SECRET_KEY=${GATEWAY_SECRET_KEY:-secret_avatar_gateway_key_2026}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://host.docker.internal:1234/v1}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-default}
    extra_hosts:
      - "host.docker.internal:host-gateway"
