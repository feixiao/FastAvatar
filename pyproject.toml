[project]
name = "fast-avatar"
version = "0.1.0"
description = "Fast, low-latency streaming digital avatar engine (audio-first with video expansion roadmap)"
authors = [{ name = "FastAvatar Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "websockets>=12.0",
    "pydantic>=2.6.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
    "edge-tts>=7.0.0",
    "sherpa-onnx>=1.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
